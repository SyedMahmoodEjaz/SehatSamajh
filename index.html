<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SehatSamajh — Kiosk Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A26;
    --ink-soft:#4C5A55;
    --paper:#FBF8F2;
    --panel:#F1EBDD;
    --teal:#184D45;
    --teal-deep:#0F332D;
    --sage:#DCE6D8;
    --gold:#C98A3E;
    --clay:#B0503C;
    --ok:#3E7A4F;
    --warn:#B0503C;
    --line: rgba(30,42,38,0.14);
    --radius: 22px;
    --bezel:#0B1F1B;
    --teal-grad-end:#0F332D;
    --bg-grad:
      radial-gradient(1100px 750px at 12% -8%, rgba(201,138,62,0.30), transparent 58%),
      radial-gradient(950px 700px at 108% 112%, rgba(24,77,69,0.30), transparent 55%),
      linear-gradient(160deg, #FCEFDD 0%, #F3DFC0 28%, #E4E8D2 55%, #CCE6DC 78%, #BEE1D8 100%);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12201C; --panel:#1B2E28; --ink:#EFEAE0; --ink-soft:#B7C4BE;
      --line: rgba(239,234,224,0.14); --sage:#22352D;
      --teal:#3FBBA3; --teal-deep:#7FEAD3; --teal-grad-end:#0B211C;
      --bg-grad:
        radial-gradient(1100px 750px at 12% -8%, rgba(201,138,62,0.20), transparent 60%),
        radial-gradient(950px 700px at 108% 112%, rgba(63,187,163,0.22), transparent 55%),
        linear-gradient(160deg, #0A1712 0%, #0E1F19 32%, #12251F 58%, #172C25 80%, #1B2E28 100%);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12201C; --panel:#1B2E28; --ink:#EFEAE0; --ink-soft:#B7C4BE;
    --line: rgba(239,234,224,0.14); --sage:#22352D;
    --teal:#3FBBA3; --teal-deep:#7FEAD3; --teal-grad-end:#0B211C;
    --bg-grad:
      radial-gradient(1100px 750px at 12% -8%, rgba(201,138,62,0.20), transparent 60%),
      radial-gradient(950px 700px at 108% 112%, rgba(63,187,163,0.22), transparent 55%),
      linear-gradient(160deg, #0A1712 0%, #0E1F19 32%, #12251F 58%, #172C25 80%, #1B2E28 100%);
  }
  html{height:100%; scroll-padding-top: env(safe-area-inset-top, 0px);}
  *{box-sizing:border-box;}
  body{
    height:100%; margin:0; background:var(--bg-grad); color:var(--ink);
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center;
    padding:28px 14px;
  }
  .urdu{ font-family:'Noto Nastaliq Urdu','Inter',sans-serif; }

  .stage{ width:min(430px,100%); }
  .device{
    background:var(--bezel); border-radius:38px; padding:14px 14px 22px;
    box-shadow: 0 30px 60px rgba(11,31,27,0.35), 0 2px 0 rgba(255,255,255,0.04) inset;
  }
  .camdot{ width:8px; height:8px; border-radius:50%; background:#3A4F49; margin:6px auto 10px; }
  .screen{
    background:var(--paper); border-radius:24px; overflow:hidden; position:relative;
    min-height:640px; display:flex; flex-direction:column;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 4px; min-height:34px;
  }
  .backbtn{
    border:none; background:none; color:var(--teal); font:600 15px/1 'Inter',sans-serif;
    cursor:pointer; padding:8px 4px; display:flex; align-items:center; gap:6px;
  }
  .backbtn svg{width:16px;height:16px;}
  .badge{
    font-size:12px; color:var(--ink-soft); background:var(--panel); border-radius:999px;
    padding:5px 12px; border:1px solid var(--line);
  }
  .content{ flex:1; padding:10px 22px 26px; display:flex; flex-direction:column; }
  .footer-note{
    font-size:11px; color:var(--ink-soft); text-align:center; padding:10px 20px 18px;
    border-top:1px solid var(--line);
  }

  h1.hero{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; line-height:1.25; margin:10px 0 2px; color:var(--teal-deep); }
  .hero-urdu{ font-size:26px; margin:2px 0 14px; color:var(--teal-deep); }
  p.lede{ color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin:0 0 18px; }

  .btn{
    border:none; border-radius:16px; padding:16px 18px; font:600 15px/1.3 'Inter',sans-serif;
    cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--teal), var(--teal-grad-end) 130%); color:#F6F2E8; justify-content:center; font-size:16px; box-shadow:0 8px 18px rgba(15,51,45,0.22); }
  .btn-primary:active{ background:var(--teal-deep); }
  .btn-ghost{
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
  }
  .btn-ghost:active{ background:var(--sage); }

  .icon-badge{
    width:38px; height:38px; border-radius:11px; background:var(--sage); color:var(--teal);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-badge svg{ width:19px; height:19px; }

  .stack{ display:flex; flex-direction:column; gap:12px; margin-top:auto; margin-bottom:6px; }
  .center-mid{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:14px; }

  .lang-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .lang-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 10px;
    text-align:center; cursor:pointer; font-weight:600;
  }
  .lang-card .native{ font-size:19px; display:block; margin-bottom:4px; }
  .lang-card .rom{ font-size:11px; color:var(--ink-soft); font-weight:500; }
  .lang-card:active{ background:var(--sage); }

  .menu-card{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:16px; cursor:pointer;
  }
  .menu-card:active{ background:var(--sage); }
  .menu-card .t{ font-weight:700; font-size:15px; }
  .menu-card .s{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .menu-card .icon-badge{ background:linear-gradient(135deg, var(--teal), var(--teal-grad-end) 130%); color:#F6F2E8; }

  .chiprow{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .chip{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .chip:active{ background:var(--sage); }

  .mic-pulse{
    width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg, var(--teal), var(--teal-grad-end) 130%); color:#F6F2E8;
    display:flex; align-items:center; justify-content:center; margin:0 auto;
    box-shadow:0 0 0 10px rgba(24,77,69,0.12);
  }
  .mic-pulse svg{ width:38px; height:38px; }
  .mic-pulse{ cursor:pointer; transition:box-shadow .3s ease; }
  .mic-pulse.listening{ box-shadow:0 0 0 14px rgba(24,77,69,0.18); animation:micPulse 1s ease-in-out infinite; }
  @keyframes micPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  .type-row{ display:flex; gap:8px; margin-top:16px; }
  .type-input{
    flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:12px; padding:12px 14px; font:500 14px/1.3 'Inter',sans-serif; outline:none;
  }
  .type-input:focus{ border-color:var(--teal); }
  .btn-type-go{
    border:none; border-radius:12px; padding:0 18px; font:600 14px/1 'Inter',sans-serif;
    background:linear-gradient(135deg, var(--teal), var(--teal-grad-end) 130%); color:#F6F2E8; cursor:pointer;
  }

  .spin{
    width:54px; height:54px; border-radius:50%; border:4px solid var(--sage);
    border-top-color:var(--teal); animation:spin 0.9s linear infinite; margin:0 auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .result-card{
    background:linear-gradient(150deg, var(--teal), var(--teal-grad-end) 140%); color:#F6F2E8; border-radius:20px; padding:22px; text-align:center;
    margin-top:6px;
  }
  .result-card .dept{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; margin:4px 0 10px;}
  .result-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-top:1px solid rgba(246,242,232,0.18); }
  .direction{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; font-size:13px; color:#E7E2D2; }
  .direction svg{ width:16px; height:16px; }

  .safety{
    display:flex; gap:10px; background:var(--panel); border:1px dashed var(--line);
    border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--ink-soft); margin-top:14px;
  }

  .lab-line{
    display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid var(--line);
  }
  .lab-line:last-child{ border-bottom:none; }
  .lab-line .name{ font-weight:600; font-size:14px; }
  .lab-line .val{ font-size:13px; color:var(--ink-soft); }
  .tag{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .tag-ok{ background:rgba(62,122,79,0.15); color:var(--ok); }
  .tag-watch{ background:rgba(176,80,60,0.15); color:var(--warn); }
  .explain{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }

  .med-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .med-card .name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--teal-deep); }
  .med-card .row{ font-size:13px; margin-top:8px; color:var(--ink-soft); }
  .med-card .row b{ color:var(--ink); font-weight:600; }
  .med-card .precaution{ margin-top:10px; background:rgba(176,80,60,0.1); color:var(--clay); border-radius:10px; padding:8px 10px; font-size:12.5px; font-weight:600; }

  .homebtn-row{ display:flex; justify-content:center; margin-top:18px; }
  .dot{ width:120px; height:5px; border-radius:99px; background:#31423C; }
  .hidden{ display:none !important; }

  /* Splash / intro animation */
  #splash{
    position:fixed; inset:0; z-index:999;
    background:radial-gradient(circle at 50% 30%, var(--teal) 0%, var(--teal-deep) 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    animation: splashOut 0.7s ease forwards; animation-delay:2.5s;
  }
  .splash-mark{
    width:64px; height:64px; border-radius:18px; background:rgba(246,242,232,0.12);
    display:flex; align-items:center; justify-content:center; margin-bottom:6px;
    opacity:0; transform:scale(0.7); animation: splashPop 0.7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:0.05s;
  }
  .splash-mark svg{ width:30px; height:30px; color:#F6F2E8; }
  .splash-name{
    font-family:'Fraunces',serif; font-weight:700; font-size:36px; color:#F6F2E8;
    letter-spacing:0.3px; opacity:0; transform:translateY(14px);
    animation: splashIn 0.8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:0.25s;
  }
  .splash-urdu{
    font-family:'Noto Nastaliq Urdu','Inter',sans-serif; font-size:21px; color:#DCE6D8;
    opacity:0; animation: splashIn 0.8s ease forwards; animation-delay:0.7s;
  }
  .splash-tag{
    font-size:11.5px; color:#B7C4BE; letter-spacing:3px; text-transform:uppercase; margin-top:4px;
    opacity:0; animation: splashIn 0.7s ease forwards; animation-delay:1.05s;
  }
  .splash-dots{ display:flex; gap:6px; margin-top:16px; opacity:0; animation: splashIn 0.5s ease forwards; animation-delay:1.35s; }
  .splash-dots span{ width:6px; height:6px; border-radius:50%; background:var(--gold); animation: dotBeat 1.1s ease-in-out infinite; }
  .splash-dots span:nth-child(2){ animation-delay:0.15s; }
  .splash-dots span:nth-child(3){ animation-delay:0.3s; }

  @keyframes splashPop{ to{ opacity:1; transform:scale(1);} }
  @keyframes splashIn{ to{ opacity:1; transform:translateY(0);} }
  @keyframes dotBeat{ 0%,100%{ transform:scale(1); opacity:.6;} 50%{ transform:scale(1.5); opacity:1;} }
  @keyframes splashOut{ to{ opacity:0; visibility:hidden; pointer-events:none; } }

  .stage{ opacity:0; animation: stageIn 0.6s ease forwards; animation-delay:2.6s; }
  @keyframes stageIn{ to{ opacity:1; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
  </div>
  <div class="splash-name">SehatSamajh</div>
  <div class="splash-urdu urdu">صحت سمجھ</div>
  <div class="splash-tag">Hospital Kiosk</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>
<div class="stage">
  <div class="device">
    <div class="camdot"></div>
    <div class="screen" id="screen"></div>
    <div class="homebtn-row"><div class="dot"></div></div>
  </div>
</div>

<script>
const ICONS = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  mic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>`,
  report: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M9 13h8M9 17h8M9 9h3"/></svg>`,
  rx: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22 19 8M9 22l-4-4M2 15l4 4M14 2l8 8-3 3-8-8z"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>`,
  cam: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="14" r="3.5"/></svg>`
};

const DEPTS = {
  fever:{ label:'Fever, headache & body ache', dept:'General Medicine', deptUrdu:'جنرل میڈیسن', counter:'4', floor:'Ground Floor', urgent:false,
    kw:['fever','headache','body ache','flu','cold','weak','bukhar'] },
  chest:{ label:'Chest pain / shortness of breath', dept:'Cardiology', deptUrdu:'امراض قلب', counter:'9', floor:'2nd Floor', urgent:true,
    kw:['chest pain','breath','breathing','heart','chest'] },
  stomach:{ label:'Stomach ache & vomiting', dept:'Gastroenterology', deptUrdu:'معدہ و انتڑیاں', counter:'6', floor:'Ground Floor', urgent:false,
    kw:['stomach','vomit','nausea','abdomen','digestion','ulcer'] },
  skin:{ label:'Skin rash / itching', dept:'Dermatology', deptUrdu:'جلدی امراض', counter:'12', floor:'3rd Floor', urgent:false,
    kw:['skin','rash','itch','allergy','acne'] },
  preg:{ label:'Pregnancy checkup', dept:'Gynecology & Obstetrics', deptUrdu:'امراض نسواں', counter:'3', floor:'1st Floor', urgent:false,
    kw:['pregnant','pregnancy','gynae','women'] },
  eye:{ label:'Eye pain / blurred vision', dept:'Ophthalmology', deptUrdu:'امراض چشم', counter:'15', floor:'3rd Floor', urgent:false,
    kw:['eye','vision','blurred','sight'] },
  bone:{ label:'Bone pain / injury / fracture', dept:'Orthopedics', deptUrdu:'امراض ہڈی', counter:'7', floor:'1st Floor', urgent:false,
    kw:['bone','fracture','injury','joint','back pain','knee'] },
  child:{ label:"Child unwell / vaccination", dept:'Pediatrics', deptUrdu:'اطفال', counter:'2', floor:'Ground Floor', urgent:false,
    kw:['child','baby','vaccination','kids'] },
  tooth:{ label:'Toothache / dental pain', dept:'Dentistry', deptUrdu:'امراض دندان', counter:'18', floor:'3rd Floor', urgent:false,
    kw:['tooth','teeth','dental','gum'] },
  ent:{ label:'Ear pain / throat infection', dept:'ENT (Ear, Nose & Throat)', deptUrdu:'کان، ناک، گلا', counter:'10', floor:'2nd Floor', urgent:false,
    kw:['ear','throat','nose','sore throat'] }
};

const REPORTS = {
  cbc:{ title:'Complete Blood Count (CBC)', lines:[
      {name:'Hemoglobin', val:'10.8 g/dL', tag:'watch'},
      {name:'White Blood Cells', val:'7,200 /µL', tag:'ok'},
      {name:'Platelets', val:'2.4 lakh /µL', tag:'ok'}],
    explain:'Your hemoglobin is a little lower than normal — this can mean mild anemia, which is common and often improves with iron-rich food or supplements. Your other blood values are within the normal range. Please share this with your doctor at the counter shown.' },
  sugar:{ title:'Blood Sugar (Fasting)', lines:[
      {name:'Fasting Glucose', val:'118 mg/dL', tag:'watch'}],
    explain:'Your fasting sugar is slightly above the usual range. It is not very high, but it is worth discussing with a doctor, especially if this has happened before. Try to avoid sugary food before your appointment.' },
  xray:{ title:'Chest X-Ray Report', lines:[
      {name:'Lung Fields', val:'Clear', tag:'ok'},
      {name:'Heart Size', val:'Normal', tag:'ok'}],
    explain:'The written report describes your lungs and heart shadow as normal in size and appearance. This is a simple reading of the report\'s own text — only your doctor can confirm what it means for you.' },
  lft:{ title:'Liver Function Test (LFT)', lines:[
      {name:'ALT (SGPT)', val:'52 U/L', tag:'watch'},
      {name:'Bilirubin', val:'0.9 mg/dL', tag:'ok'}],
    explain:'One liver enzyme is a little above the usual range, which can happen for several reasons and is not automatically serious. Your bilirubin, which relates to jaundice, is normal. Please discuss this reading with your doctor.' },
  thyroid:{ title:'Thyroid (TSH) Test', lines:[
      {name:'TSH', val:'5.8 mIU/L', tag:'watch'}],
    explain:'Your TSH level is a bit higher than the typical range, which can be linked to how your thyroid gland is working. This alone does not confirm a diagnosis — your doctor will look at this alongside your symptoms.' },
  urine:{ title:'Urine Routine Examination', lines:[
      {name:'Pus Cells', val:'2-4 /HPF', tag:'ok'},
      {name:'Protein', val:'Nil', tag:'ok'}],
    explain:'Your urine test values are within the normal range, with no signs of infection or protein loss shown in this report.' }
};

const RX = {
  fever:[
    {name:'Panadol (Paracetamol) 500mg', purpose:'Reduces fever and body pain', dose:'1 tablet every 6 hours, after food', caution:'Do not take more than 4 tablets in a day. Avoid alcohol.'},
    {name:'Augmentin (Amoxicillin) 625mg', purpose:'Antibiotic for bacterial infection', dose:'1 tablet twice a day, for 5 days', caution:'Finish the full course even if you feel better sooner.'}
  ],
  stomach:[
    {name:'Omeprazole 20mg', purpose:'Reduces stomach acid', dose:'1 capsule before breakfast, daily', caution:'Take on an empty stomach. Do not use long-term without a doctor\'s advice.'}
  ],
  skin:[
    {name:'Cetirizine 10mg', purpose:'Relieves itching and allergy symptoms', dose:'1 tablet at night', caution:'May cause drowsiness — avoid driving after taking it.'},
    {name:'Betnovate Cream', purpose:'Reduces skin inflammation and rash', dose:'Apply a thin layer twice daily on the affected area', caution:'Do not use on the face for more than 5 days without a doctor\'s advice.'}
  ],
  bp:[
    {name:'Amlodipine 5mg', purpose:'Controls high blood pressure', dose:'1 tablet daily, same time each day', caution:'Do not stop suddenly without consulting your doctor.'}
  ]
};

let state = { screen:'home', symptomKey:null, reportKey:null, rxKey:'fever' };

function go(screen){ state.screen = screen; render(); }

function topbar(showBack){
  return `<div class="topbar">
    ${showBack ? `<button class="backbtn" onclick="history.back && goBack()">${ICONS.back} Back</button>` : `<span></span>`}
    <span class="badge urdu">اردو / EN</span>
  </div>`;
}
const backMap = { language:'home', menu:'language', 'symptom-pick':'menu', 'symptom-processing':'symptom-pick', 'department-result':'symptom-pick',
  'lab-pick':'menu', 'lab-processing':'lab-pick', 'lab-result':'lab-pick', 'rx-pick':'menu', 'rx-processing':'rx-pick', 'rx-result':'rx-pick' };
function goBack(){ go(backMap[state.screen] || 'home'); }

function render(){
  const el = document.getElementById('screen');
  el.innerHTML = SCREENS[state.screen]();
}

const SCREENS = {
  home: () => `
    ${topbar(false)}
    <div class="content center-mid">
      <div class="icon-badge" style="width:64px;height:64px;border-radius:18px;">${ICONS.pin}</div>
      <div>
        <h1 class="hero">Welcome to SehatSamajh</h1>
        <div class="hero-urdu urdu">خوش آمدید</div>
        <p class="lede">A hospital helper kiosk. It listens, reads, and explains — in your language.</p>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="go('language')">Tap to begin · شروع کریں</button>
    </div>
    <div class="footer-note">Jinnah Hospital · SehatSamajh Kiosk · No app or internet needed</div>
  `,
  language: () => `

  `,
  menu: () => `
    ${topbar(true)}
    <div class="content">
      <h1 class="hero" style="font-size:21px;">How can we help?</h1>
      <p class="lede">آپ کی کیا مدد کریں؟</p>
      <div class="chiprow" style="gap:12px;">
        <div class="menu-card" onclick="go('symptom-pick')">
          <div class="icon-badge">${ICONS.mic}</div>
          <div><div class="t">Where should I go?</div><div class="s">Tell us your symptoms · کہاں جانا ہے؟</div></div>
        </div>
        <div class="menu-card" onclick="go('lab-pick')">
          <div class="icon-badge">${ICONS.report}</div>
          <div><div class="t">Explain my lab report</div><div class="s">Scan your test report · رپورٹ سمجھیں</div></div>
        </div>
        <div class="menu-card" onclick="go('rx-pick')">
          <div class="icon-badge">${ICONS.rx}</div>
          <div><div class="t">Explain my prescription</div><div class="s">Scan your doctor's note · نسخہ سمجھیں</div></div>
        </div>
      </div>
    </div>
  `,
  'symptom-pick': () => `
    ${topbar(true)}
    <div class="content">
      <div class="mic-pulse" id="micBtn" onclick="startVoice()">${ICONS.mic}</div>
      <p class="lede" id="micStatus" style="text-align:center;margin-top:14px;">Tap the mic and speak, type below, or choose a symptom</p>
      <div class="type-row">
        <input id="symptomInput" class="type-input" type="text" placeholder="Type your symptom here… e.g. fever, chest pain" onkeydown="if(event.key==='Enter')submitTyped()">
        <button class="btn-type-go" onclick="submitTyped()">Go</button>
      </div>
      <div class="chiprow" style="margin-top:16px;">
        ${Object.entries(DEPTS).map(([k,v])=>`<div class="chip" onclick="pickSymptom('${k}')">${v.label}</div>`).join('')}
      </div>
    </div>
  `,
  'symptom-processing': () => `
    ${topbar(false)}
    <div class="content center-mid">
      <div class="spin"></div>
      <p class="lede">Understanding your symptoms…</p>
    </div>
  `,
  'department-result': () => {
    const d = DEPTS[state.symptomKey];
    return `
    ${topbar(true)}
    <div class="content">
      <p class="lede" style="margin-bottom:6px;">You should go to</p>
      <div class="result-card">
        ${d.urgent ? `<div class="badge" style="background:rgba(246,242,232,0.16);color:#F6F2E8;border:none;">Please go promptly</div>` : ''}
        <div class="dept">${d.dept}</div>

        <div class="result-row"><span>Counter</span><span>${d.counter}</span></div>
        <div class="result-row"><span>Location</span><span>${d.floor}</span></div>
        <div class="direction">${ICONS.pin} Follow the ${d.floor} signs from the main lobby</div>
      </div>
      <div class="safety">${ICONS.pin} This kiosk only guides you to the right counter. It does not diagnose your condition — a doctor will do that.</div>

  },
  'lab-pick': () => `
    ${topbar(true)}
    <div class="content">
      <div class="icon-badge" style="width:64px;height:64px;border-radius:18px;margin:0 auto;">${ICONS.cam}</div>
      <p class="lede" style="text-align:center;margin-top:14px;">Scan your report, or try a sample below</p>
      <div class="chiprow">
        ${Object.entries(REPORTS).map(([k,v])=>`<div class="chip" onclick="pickReport('${k}')">${v.title}</div>`).join('')}
      </div>
    </div>
  `,
  'lab-processing': () => `

    <div class="content center-mid">

  `,
  'lab-result': () => {
    const r = REPORTS[state.reportKey];
    return `

  'rx-pick': () => `

    <div class="content">
      <div class="icon-badge" style="width:64px;height:64px;border-radius:18px;margin:0 auto;">${ICONS.cam}</div>

    return `

function pickSymptom(key){ state.symptomKey = key; go('symptom-processing'); setTimeout(()=>go('department-result'), 1400); }

// Matches free-text (typed or spoken) against known symptom keywords.
// Deliberately does NOT guess between close matches or invent a department —
// if nothing matches confidently, it says so rather than picking randomly.
function matchSymptom(text){
  if(!text) return null;
  const t = text.toLowerCase();
  for(const [key, v] of Object.entries(DEPTS)){
    if(v.kw.some(k => t.includes(k))) return key;
  }
  return null;
}

function submitTyped(){
  const input = document.getElementById('symptomInput');
  const text = input ? input.value.trim() : '';
  handleFreeText(text, 'typed');
}

function handleFreeText(text, source){
  const match = matchSymptom(text);
  if(match){
    pickSymptom(match);
  } else if(text){
    const statusEl = document.getElementById('micStatus');
    if(statusEl) statusEl.textContent = "We couldn't confidently match that — please choose a symptom below.";
  }
}

// --- Voice input ---
// Uses the browser's built-in speech recognition where available.
// Designed to always release the UI back to the user: on any error, timeout,
// no-match, or unsupported browser, it falls back to typing/tap-chips
// instead of leaving the mic stuck in a "listening" state.
let recognition = null;
let voiceTimeout = null;

function resetMicUI(msg){
  const btn = document.getElementById('micBtn');
  const status = document.getElementById('micStatus');
  if(btn) btn.classList.remove('listening');
  if(status) status.textContent = msg || "Tap the mic and speak, type below, or choose a symptom";
  if(voiceTimeout){ clearTimeout(voiceTimeout); voiceTimeout = null; }
}

function startVoice(){
  const btn = document.getElementById('micBtn');
  const status = document.getElementById('micStatus');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SR){
    // Browser doesn't support it at all — don't block the patient, just
    // point them to typing/tapping instead.
    if(status) status.textContent = "Voice isn't available on this device — please type or tap a symptom below.";
    return;
  }

  try{
    if(btn) btn.classList.add('listening');
    if(status) status.textContent = "Listening… speak your symptom now";

    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    // Hard safety timeout: if nothing fires within 6s (mic denied, silence,
    // a hung browser API), force the UI back to normal rather than staying
    // stuck on "Listening…" forever.
    voiceTimeout = setTimeout(()=>{
      try{ recognition && recognition.stop(); }catch(e){}
      resetMicUI("Didn't catch that in time — please try again or type below.");
    }, 6000);

    recognition.onresult = (e) => {
      clearTimeout(voiceTimeout);
      const text = e.results[0][0].transcript;
      resetMicUI();
      handleFreeText(text, 'voice');
    };
    recognition.onerror = () => {
      resetMicUI("Couldn't hear that clearly — please try again or type below.");
    };
    recognition.onend = () => {
      // Guards against the "listening" state getting stuck if onresult/onerror
      // never fire for some reason.
      if(voiceTimeout){ resetMicUI(); }
    };

    recognition.start();
  }catch(err){
    // Any unexpected failure (e.g. permission blocked) still returns
    // control to the patient instead of freezing the screen.
    resetMicUI("Voice input isn't working right now — please type or tap a symptom below.");
  }
}
function pickReport(key){ state.reportKey = key; go('lab-processing'); setTimeout(()=>go('lab-result'), 1400); }
function pickRx(key){ state.rxKey = key; go('rx-processing'); setTimeout(()=>go('rx-result'), 1400); }

render();

// Remove the splash screen from the DOM once its fade-out finishes
setTimeout(function(){
  const s = document.getElementById('splash');
  if (s) s.remove();
}, 3300);
</script>
